server:
  port: 8088
  servlet:
    context-path: /bontolink

spring:
  application:
    name: bontolink-admin
  profiles:
    active: postgresql
  flyway:
    enabled: true
    # Flyway 脚本在 bontolink-data 模块的 jar 包里
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true  # 允许乱序执行迁移，适配 common + vendor 双目录结构
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # Redis 连接配置（仅当 bontolink.cache.type=remote 时生效）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# 缓存配置开关
bontolink:
  # 函数在线编排 IDE 的代码仓 (JGit 工作区)
  # 凭据一律走环境变量, 此处只写变量名, 不落任何明文:
  #   FN_REPO_URL / FN_REPO_USER / FN_REPO_TOKEN / FN_REPO_BRANCH
  #   FN_REPO_AUTHOR_NAME / FN_REPO_AUTHOR_EMAIL / FN_REPO_AUTO_PUSH
  fn-repo:
    enabled: ${FN_REPO_ENABLED:true}
    url: ${FN_REPO_URL:}                       # 空则退化为本地仓库, 不做远程同步
    branch: ${FN_REPO_BRANCH:master}
    workdir: ${FN_REPO_WORKDIR:../fn-repo}     # 相对 user.dir(backend/), 即 <项目根>/fn-repo
    username: ${FN_REPO_USER:}
    token: ${FN_REPO_TOKEN:}
    author-name: ${FN_REPO_AUTHOR_NAME:BOntoLink}
    author-email: ${FN_REPO_AUTHOR_EMAIL:bontolink@local}
    # 默认手动推送:IDE 里保存只在本地提交, 攒批后由「推送」按钮 (POST /api/fn-repo/push) 推远程,
    # 避免每存一次盘就往 master 推一个提交, 把历史打碎
    auto-push: ${FN_REPO_AUTO_PUSH:false}
    bootstrap: ${FN_REPO_BOOTSTRAP:true}
  cache:
    # 缓存类型: local(仅本地Caffeine) / remote(本地+Redis二级缓存) / none(禁用)
    type: local
  ontology:
    jena-enabled: false
    storage-mode: memory
    reasoner-type: owl
    vector:
      type: none
      milvus-host: 127.0.0.1
      milvus-port: 19530
      milvus-collection: ont_entity_embeddings
      dimension: 768
    fuseki:
      enabled: false
      port: 3030
      dataset-name: ontology
  embedding:
    provider: siliconflow   # mock / siliconflow
  deepseek:
    api-key: sk-5f5667ffbfe94c4e924e65de42ab46bd
    base-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
  siliconflow:
    api-key: sk-gndwpiiwzjxjwvtqmdlcwbazbmebkzlxtgutenjcsetvaowb
    base-url: https://api.siliconflow.cn/v1/embeddings
    model: BAAI/bge-base-zh-v1.5
    timeout-seconds: 30
  datasource:
    pool:
      max-pool-size: 5
      min-idle: 2
      connection-timeout-ms: 30000
      idle-timeout-ms: 300000
      max-lifetime-ms: 1800000
      leak-detection-threshold-ms: 0

mybatis:
  type-aliases-package: com.beiktech.bontolink.data.entity
  object-factory: com.beiktech.bontolink.base.mybatis.CaseInsensitiveMapObjectFactory
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: true

jetcache:
  statIntervalMinutes: 0
  areaInCacheName: false
  local:
    default:
      type: caffeine
      limit: 500
      keyConvertor: fastjson2
      expireAfterWriteInMillis: 1800000
  # 启用 Redis 二级缓存：将 bontolink.cache.type 改为 remote，并取消下方注释
  # remote:
  #   default:
  #     type: redis.springdata
  #     keyConvertor: fastjson2
  #     valueEncoder: java
  #     valueDecoder: java
  #     expireAfterWriteInMillis: 1800000
  #     poolConfig:
  #       minIdle: 5
  #       maxIdle: 20
  #       maxTotal: 50

logging:
  level:
    root: INFO
    com.beiktech.bontolink: DEBUG
    org.springframework.jdbc.core: INFO
    org.flywaydb: INFO
