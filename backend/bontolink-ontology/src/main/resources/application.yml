server:
  port: 8089
  servlet:
    context-path: /bontolink-ontology

spring:
  application:
    name: bontolink-ontology
  profiles:
    active: sqlite
  flyway:
    enabled: false  # 数据层模块已管理 Flyway
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  type-aliases-package: com.beiktech.bontolink.data.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 本体服务配置（属性映射：OntologyEngineConfig）
bontolink:
  ontology:
    # 是否启用 Jena OntModel（false=纯文本匹配，不加载本体模型）
    jena-enabled: true
    # Jena 存储模式: memory / tdb2
    storage-mode: memory
    # TDB2 目录（storage-mode=tdb2 时生效）
    tdb2-location: ./data/tdb2
    # 推理器类型: none / rdfs / owl / owl-micro
    reasoner-type: owl
    # 向量库配置（映射：OntologyEngineConfig.VectorConfig）
    vector:
      # 是否启用向量库连接（pgvector / milvus）
      enabled: true
      # 向量库类型: pgvector | milvus
      type: milvus
      # 向量维度（需与 embedding 模型匹配,bge-m3 = 1024）
      dimension: 1024
      # --- Milvus 连接配置（type=milvus 时生效） ---
      milvus-host: 127.0.0.1
      milvus-port: 19530
      milvus-collection: ont_entity_embeddings
      milvus-home: "D:\\soft\\milvus"     # 本地安装路径（启动提示用）
