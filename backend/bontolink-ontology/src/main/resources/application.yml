server:
  port: 8089
  servlet:
    context-path: /bontolink-ontology

spring:
  application:
    name: bontolink-ontology
  profiles:
    active: sqlite
  flyway:
    enabled: false  # 数据层模块已管理 Flyway
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  type-aliases-package: com.beiktech.bontolink.data.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 本体服务配置（属性映射：OntologyEngineConfig）
bontolink:
  ontology:
    jena-enabled: false
    storage-mode: memory
    tdb2-location: ./data/tdb2
    reasoner-type: owl
    fuseki:
      enabled: false
      port: 3030
      dataset-name: ontology
    vector:
      enabled: true
      type: pgvector
      dimension: 768
