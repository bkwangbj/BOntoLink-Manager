<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPARQL 查询 · BOntoLink</title>
  <link rel="stylesheet" href="./yasgui.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1d2939;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .sub { font-size: 12px; color: #8fa3bf; }
    .endpoint-bar {
      background: #fff;
      border-bottom: 1px solid #e5e9ef;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .endpoint-bar label { font-size: 12px; color: #86909c; white-space: nowrap; }
    .endpoint-bar input {
      flex: 1;
      border: 1px solid #d0d5dd;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      outline: none;
    }
    .endpoint-bar input:focus { border-color: #165dff; }
    .endpoint-bar button {
      background: #165dff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .endpoint-bar button:hover { background: #4080ff; }
    #yasgui-container { flex: 1; overflow: hidden; }
    .yasgui { height: 100% !important; }
    .yasgui .endpointText { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4080ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </svg>
    <div>
      <h1>SPARQL 查询工作台</h1>
      <div class="sub">BOntoLink · Jena 本体知识库</div>
    </div>
  </div>

  <div class="endpoint-bar">
    <label>SPARQL 端点</label>
    <input type="text" id="endpointInput" value="http://localhost:3030/ontology/sparql" />
    <button onclick="applyEndpoint()">应用</button>
  </div>

  <div id="yasgui-container">
    <div id="yasgui"></div>
  </div>

  <script src="./yasgui.min.js"></script>
  <script>
    const DEFAULT_ENDPOINT = 'http://localhost:3030/ontology/sparql';
    const DEFAULT_QUERY = `PREFIX bl: <http://bontolink.beiktech.com/ontology#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX owl: <http://www.w3.org/2002/07/owl#>

# 查询所有对象类及其中文标签
SELECT ?class ?label WHERE {
  ?class a owl:Class ;
         rdfs:label ?label .
  FILTER(LANG(?label) = "zh")
}
ORDER BY ?label
LIMIT 20`;

    const yasgui = new Yasgui(document.getElementById('yasgui'), {
      requestConfig: {
        endpoint: DEFAULT_ENDPOINT,
        method: 'POST'
      },
      copyEndpointOnNewTab: true,
    });

    // 设置默认查询
    const tab = yasgui.getTab();
    if (tab) {
      tab.setQuery(DEFAULT_QUERY);
    }

    function applyEndpoint() {
      const endpoint = document.getElementById('endpointInput').value.trim();
      if (!endpoint) return;
      const currentTab = yasgui.getTab();
      if (currentTab) {
        currentTab.setEndpoint(endpoint);
      }
    }

    // 回车应用端点
    document.getElementById('endpointInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') applyEndpoint();
    });
  </script>
</body>
</html>
